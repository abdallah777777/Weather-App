<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="icon" type="image/png" sizes="64x64" href="images/ai-generated-sun-art-sunlight-png.png">
</head>
<body>
    <div class="header">
        <div class="container">
            <div class="logo">
                <img src="images/ai-generated-sun-art-sunlight-png.png" alt="">
                <h2>Weather Now</h2>
            </div>
            <div class="header-button">
                <div class="units">
                    <button class="active">°C</button>
                    <button>°F</button>
                </div>
                <button class="theme-toggle" id="theme-toggle">
                    <i class="fa-solid fa-sun"></i>
                </button>
            </div>
        </div>
    </div>
    <!-- End Header-->
    <!-- Start Search -->
    <div class="container">
        <div class="search">
            <h1>How's the sky looking today?</h1>
            <div class="search-box">
                <input type="text" placeholder="Search city (e.g. Gaza, Palestine)">
                <button class="search-button">Search</button>
                <p class="error-message"></p>
            </div>
        </div>
    </div>
    <!-- End Search -->
    <!-- Start Data -->
    <div class="container">
        <!-- Weather Content -->
        <div class="weather-content">
            <!-- Current Weather -->
            <div class="current-weather">
                <div class="location-time">
                    <div class="location">
                        <div class="city-name">Gaza,</div>
                        <div class="country-name">Palsetine</div>
                    </div>
                    <div class="time">
                        <div class="current-date">Tuesday,Aug 5</div>
                    </div>
                </div>

                <div class="temperature">
                    <div class="weather-icon"><img src="images/icon-sunny.webp" alt=""></div>
                    <div class="weather-condition"><i>20<sup>°</sup></i></div>
                </div>

            </div>

            <!-- Weather Highlights -->
            <div class="weather-highlights">

                <div class="fells-like">
                    <div>Feels Like</div>
                    <span></span>
                </div>
                <div class="humidity">
                    <div>Humidity</div>
                    <span></span>
                </div>
                <div class="wind">
                    <div>Wind</div>
                    <span></span>
                </div>
                <div class="precipitation">
                    <div>Precipitation</div>
                    <span></span>
                </div>

            </div>
            <!-- Daily Forecast -->
            <div class="daily-forecast">
                <div class="daily-title">Daily forecast</div>
                    <div class="daily-item">
                        <div class="day"></div>
                        <div class="day"></div>
                        <div class="day"></div>
                        <div class="day"></div>
                        <div class="day"></div>
                        <div class="day"></div>
                        <div class="day"></div>
                    </div>
            </div>


            <!-- Hourly Forecast -->
            <div class="hourly-forecast">
                <div class="hourly-header">
                    <div class="hourly-title">Hourly forecast</div>
                    <div class="days-dropdown">
                        <button class="hours-button"></button>
                        <ul class="days-list"></ul>
                    </div>
                </div>
                    <div class="hourly-item">
                        
                    </div>
            </div>
        </div>
    </div>
    <!-- End Data -->
    <script src="main.js"></script>
</body>
</html>
